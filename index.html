<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header>
            <div>
                <p class="subtitle">To Do List 📝</p>
                <h1>Personal Tasks <span>⌛</span></h1>
                <p class="description">Plan your day, achieve your goals.</p>
            </div>
            <div class="date" id="today"></div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <p>Total Tasks</p>
                <h2 id="total">0</h2>
            </div>
            <div class="stat-card">
                <p>Completed</p>
                <h2 id="completed">0</h2>
            </div>
            <div class="stat-card">
                <p>Pending</p>
                <h2 id="pending">0</h2>
            </div>
        </div>

        <section class="task-section">
            <h2>My Tasks</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    maxlength="150"
                    autocomplete="off"
                >
                <button type="submit" class="add-btn">+ Add Task</button>
            </form>

            <div class="filters">
                <button class="filter active" data-filter="all">All Tasks</button>
                <button class="filter" data-filter="pending">Pending</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage">
                <div class="empty-icon">⚡</div>
                <h3>No tasks here!</h3>
                <p>Add a task and start making progress.</p>
            </div>

            <footer>
                <p id="progressText">0 of 0 tasks completed</p>
                <button id="clearCompleted">Clear Completed</button>
            </footer>
        </section>

        <p class="bottom-text">SMALL STEPS. BIG ACHIEVEMENTS. ✨</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
